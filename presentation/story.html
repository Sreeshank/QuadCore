<!doctype html><meta charset="utf-8"><title>TaxReady AI • From scattered to prepared</title><style>body{margin:0;background:#101b33;display:grid;place-items:center;height:100vh}canvas{width:min(100vw,1280px)}button{position:fixed;bottom:12px;padding:12px}</style><canvas width="1280" height="720"></canvas><button onclick="start()">Replay story</button><script>
const c=document.querySelector('canvas'),g=c.getContext('2d'),D=45;let startAt=0;
const scenes=[
['Meet Ananya.','Tax season brings a familiar question: where do I start?'],
['Too many documents. Too little clarity.','Form 16, Form 26AS and bank statements live in different places.'],
['One workspace. A clearer first step.','Ananya uploads her records to TaxReady AI.'],
['Extract. Check. Confirm.','Source evidence stays visible. Ananya reviews every supported value.'],
['A difference worth reviewing.','TDS is INR 45,000 in Form 16 and INR 42,000 in Form 26AS.'],
['Know what remains.','A personalized checklist and explainable score guide the next steps.'],
['Organize smarter. Verify faster.','Ananya downloads a readiness report and prepares with confidence.']];
function box(x,y,w,h,color='#fff'){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,22);g.fill()}
function text(s,x,y,size=28,color='#15243d',align='left'){g.fillStyle=color;g.font=(size>=32?'700 ':'500 ')+size+'px Segoe UI, sans-serif';g.textAlign=align;g.fillText(s,x,y)}
function doc(x,y,label,angle=0){g.save();g.translate(x,y);g.rotate(angle);box(-75,-95,150,190);text(label,0,-48,19,'#2563eb','center');for(let k=0;k<4;k++){box(-49,-12+k*23,98-(k%2)*24,7,'#dce4f2')}g.restore()}
function person(x,y,happy=false){g.save();g.translate(x,y);box(-65,28,130,145,'#2563eb');g.fillStyle='#eeb68e';g.beginPath();g.arc(0,0,49,0,Math.PI*2);g.fill();g.fillStyle='#243048';g.beginPath();g.arc(0,-14,49,Math.PI,Math.PI*2);g.fill();text(happy?'⌣':'—',0,22,30,'#63463c','center');g.restore()}
function draw(t){const i=Math.min(6,Math.floor(t/(D/7))),p=t/(D/7)-i,fade=Math.min(1,p*5,(1-p)*5);g.fillStyle='#f1f5fc';g.fillRect(0,0,1280,720);g.fillStyle='#e5edff';g.beginPath();g.arc(1120,190,330,0,7);g.fill();text('TaxReady',60,62,30);text('AI',204,62,30,'#2563eb');text('FROM SCATTERED TO PREPARED',1220,60,14,'#63718a','right');g.save();g.globalAlpha=Math.max(.05,fade);text(scenes[i][0],640,144,i===1?40:44,'#142441','center');
if(i<2){person(360,360);['Form 16','Form 26AS','Bank record'].forEach((s,k)=>doc(620+k*175,350+Math.sin(t*1.4+k)*24,s,(k-1)*.16));text(i===0?'Meet Ananya':'What is missing? What matches?',640,560,24,'#62718a','center')}
if(i===2){box(365,240,550,300);text('Your private document workspace',640,294,25,'#2563eb','center');['Form 16','Form 26AS','Bank record'].forEach((s,k)=>doc(480+k*165,416+Math.sin(t+k)*8,s));text('Upload → Organize → Review',640,582,24,'#62718a','center')}
if(i===3){box(240,245,390,300);text('Original source',435,290,24,'#2563eb','center');doc(435,420,'Form 16');box(660,245,390,300);text('Review extracted fields',855,290,24,'#2563eb','center');['Salary: INR 850,000','TDS: INR 45,000','✓ Confirmed by Ananya'].forEach((s,k)=>text(s,694,358+k*60,23,k===2?'#13836c':'#24334e'))}
if(i===4){box(230,265,355,235);box(695,265,355,235);text('Form 16',407,318,26,'#63718a','center');text('INR 45,000',407,402,38,'#24334e','center');text('Form 26AS',872,318,26,'#63718a','center');text('INR 42,000',872,402,38,'#24334e','center');box(448,514,384,58,'#fff0d7');text('INR 3,000 difference',640,554,27,'#aa6500','center')}
if(i===5){box(270,240,740,325);text('Your filing preparation',310,293,26);['✓ 3 reviewed records','• 2 checklist items still missing','• 1 high-severity TDS difference'].forEach((s,k)=>text(s,310,360+k*58,23,'#526079'));g.strokeStyle='#dce4f5';g.lineWidth=16;g.beginPath();g.arc(874,392,75,0,7);g.stroke();g.strokeStyle='#2563eb';g.beginPath();g.arc(874,392,75,-Math.PI/2,-Math.PI/2+2*Math.PI*.59);g.stroke();text('59%',874,405,37,'#2563eb','center');text('Readiness',874,450,18,'#63718a','center')}
if(i===6){person(335,355,true);box(505,244,465,295);text('Readiness report',737,308,32,'#2563eb','center');['Your records, summarized','Differences, explained','Next steps, made clear'].forEach((s,k)=>text(s,550,375+k*48,24));text('TaxReady AI',640,591,36,'#2563eb','center')}
g.restore();text(scenes[i][1],640,650,22,'#526079','center');text('Synthetic example • Preparation guidance, not tax advice',640,687,14,'#7e8a9e','center');g.fillStyle='#2563eb';g.fillRect(0,714,1280*t/D,6)}
async function start(record=false){startAt=performance.now();const audio=new AudioContext(),dest=audio.createMediaStreamDestination();let recorder,chunks=[];if(record){for(let b=0;b<90;b++){const o=audio.createOscillator(),v=audio.createGain();o.type='sine';o.frequency.value=[261.63,329.63,392,523.25][b%4];v.gain.setValueAtTime(0,audio.currentTime+b*.5);v.gain.linearRampToValueAtTime(.035,audio.currentTime+b*.5+.04);v.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+b*.5+.45);o.connect(v);v.connect(dest);o.start(audio.currentTime+b*.5);o.stop(audio.currentTime+b*.5+.48)}const stream=c.captureStream(30);dest.stream.getAudioTracks().forEach(a=>stream.addTrack(a));recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus',videoBitsPerSecond:4500000});recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));a.download='TaxReady-AI-story.webm';a.click()};recorder.start()}
function frame(){const t=Math.min(D,(performance.now()-startAt)/1000);draw(t);if(t<D)requestAnimationFrame(frame);else if(recorder)recorder.stop()}frame()}
draw(0);window.renderVideo=()=>start(true);start();
</script>
